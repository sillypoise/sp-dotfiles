default_roles:
  - users
  - bash
  - zsh
  - nix
  - aws
  - media-tools
  - volta
  - git
  - ssh
  - openssh
  - ufw
  - tailscale
  - c
  - swift
  - btop
  - nvim
  - opencode
  - pi
  - zellij
  # - test

exclude_roles:
  - bootstrap

# Default values for system facts
facts_op_installed: false
facts_nix_installed: false
facts_home_manager_installed: false
facts_zsh_installed: false
facts_tailscale_installed: false
facts_tailscale_authed: false
tailscale_accept_dns: true

# Nix/Home Manager releases
nixpkgs_release: "nixos-26.05"
home_manager_release: "release-26.05"

# Official Swift tooling (outside Nix).
swiftly_version: "1.2.0"
# SHA-256 of the archive fetched from download.swift.org over HTTPS.
swiftly_archive_sha256: "0b26b568811404374c7d7f07276b6aad4145db5d1893a45f307de6a94ca8d9c3"
swift_toolchain_version: "6.4.0"

# iOS development on Linux (opt-in: `dotfiles -t ios`). See roles/ios/README.md.
# The installer pins xtool, OpenAppleMacros, rcodesign, and ipsw itself.
ios_toolchain_repo: "https://github.com/joshuaswarren/omarchy-apple-dev.git"
ios_toolchain_ref: "7837b6885e209f06d1b040cc7f40282cf6858102"
# Ubuntu's libimobiledevice is too old for xtool; these build in list order.
ios_imobiledevice_repo_base: "https://github.com/libimobiledevice"
ios_imobiledevice_sources:
  - name: "libplist"
    ref: "fe3dc34dc3484006e12b403f7ceb06f0ad40b6f4"
  - name: "libimobiledevice-glue"
    ref: "10ddafa16458a012bcbd3e83a6ab36a032dc84d8"
  - name: "libtatsu"
    ref: "e7d6ad13ef928aa609d0ccdfc586f7d6e8e049bf"
  - name: "libimobiledevice"
    ref: "fa0f79190142bc309307967c058f89c1b36eb6b8"
ios_pymobiledevice3_version: "11.26.0"
# The device tunnel needs Python 3.13 or newer (TLS-PSK in the ssl module); Ubuntu 24.04 ships 3.12.
# Home Manager installs this interpreter (roles/nix).
ios_python: "{{ host_user_home }}/.nix-profile/bin/python3.13"
# The Xcode whose Swift matches swift_toolchain_version: 27 for 6.4, 26 for 6.3.
ios_xcode_major: "27"
# Downloaded by hand from developer.apple.com; the role never fetches it.
ios_xcode_xip: "{{ host_user_home }}/Downloads/Xcode.xip"
# Derived paths.
ios_swift_bin: "{{ host_user_home }}/.local/share/swiftly/toolchains/{{ swift_toolchain_version }}/usr/bin"
ios_source_dir: "{{ host_user_home }}/.cache/ios-dev/src"
ios_state_dir: "{{ host_user_home }}/.local/state/ios-dev"
ios_toolchain_dir: "{{ host_user_home }}/.local/share/omarchy-apple-dev"
# A change to any pinned libimobiledevice commit selects a new prefix, so all four rebuild together.
ios_imobiledevice_prefix: >-
  {{ host_user_home }}/.local/lib/ios-dev/imobiledevice-{{
  (ios_imobiledevice_sources | map(attribute='ref') | join('-') | hash('sha256'))[:12] }}
ios_xtool_lib_dir: "{{ host_user_home }}/.local/lib/omarchy-apple-dev/xtool-{{ ios_xtool_revision.stdout | trim }}"
ios_install_marker: >-
  {{ ios_state_dir }}/installed-{{ ios_toolchain_ref[:12] }}-swift-{{ swift_toolchain_version }}

# Media tools releases
media_tools_yt_dlp_version: "2026.02.21"

# AWS IAM Identity Center
aws_identity_center:
  session_name: "sp"
  start_url: "https://ssoins-7223cce72b420872.portal.us-east-1.app.aws"
  region: "us-east-1"
aws_profiles:
  - name: "sp"
    account_id: "397483721549"
    permission_set: "AdministratorAccess"
    region: "us-east-1"
  - name: "sp-ro"
    account_id: "397483721549"
    permission_set: "ReadOnlyAccess"
    region: "us-east-1"

# Pi defaults
pi_default_provider: "claude-bridge"
pi_default_model: "claude-opus-5-5"
pi_default_thinking_level: "low"
# Cycle through available GPT 5.6–6.1 variants and Kimi.
pi_enabled_models:
  - "claude-bridge/claude-fable-5-1"
  - "claude-bridge/claude-opus-5-5"
  - "claude-bridge/claude-sonnet-5-5"
  - "openai-codex/gpt-5.6-luna"
  - "openai-codex/gpt-5.6-sol"
  - "openai-codex/gpt-5.6-terra"
  - "openai-codex/gpt-6-astra"
  - "openai-codex/gpt-6-luna"
  - "openai-codex/gpt-6-sol"
  - "openai-codex/gpt-6.1-sol"
  - "kimi-for-coding"
pi_guides_enable_global: true
pi_guides_source: "git:git@github.com:sillypoise/pi-guides@v0.7.1"
pi_extra_packages: []
pi_managed_source_packages:
  - name: "pi-claude-bridge"
    repo: "https://github.com/elidickinson/pi-claude-bridge.git"
    ref: "df907dbb5f9cec66446c89a9e2c8eb1c89a7828c"
    checkout_path: "{{ host_user_home }}/.pi/agent/src/pi-claude-bridge"
    package_path: "{{ host_user_home }}/.pi/agent/src/pi-claude-bridge"
    dependency_marker: "node_modules/@anthropic-ai/claude-agent-sdk/package.json"
    install_command: "npm install --omit=dev --legacy-peer-deps"
  - name: "fff.nvim"
    repo: "https://github.com/dmtrKovalenko/fff.nvim.git"
    ref: "4b13a91aa57c5e9ed32ee381d9ee521800818370"
    checkout_path: "{{ host_user_home }}/.pi/agent/src/fff.nvim"
    package_path: "{{ host_user_home }}/.pi/agent/src/fff.nvim/packages/pi-fff"
    dependency_marker: "node_modules/@ff-labs/fff-node/package.json"
    install_command: "npm install --omit=dev"
pi_keybindings:
  app.interrupt:
    - ctrl+x
  app.model.cycleForward: []
  app.session.toggleNamedFilter: []
  app.session.togglePath: []
  tui.editor.cursorDown:
    - down
  tui.editor.cursorUp:
    - up
  tui.editor.pageDown:
    - pageDown
    - ctrl+down
  tui.editor.pageUp:
    - pageUp
    - ctrl+up
  tui.select.down:
    - down
    - ctrl+n
  tui.select.up:
    - up
    - ctrl+p

# Base package lists by distro
packages_common:
  - git
  - curl
  - unzip

packages_arch:
  - python
  - python-pip
  - openssh

packages_ubuntu:
  - python3
  - python3-pip
  - openssh-client
  - openssh-server

# Users facts
facts_sillypoise_exists: false
facts_flubber_exists: false
facts_password_setup_complete: false

# Define usernames
host_user: "sillypoise"
automated_user: "flubber"
gh_user: "sillypoise"

# OpenCode guides source-of-truth repo
opencode_guides_repo: "sillypoise/sp-opencode-guides"
opencode_guides_ref: "v0.5.0"
opencode_guides_clone_path: "{{ host_user_home }}/.local/share/opencode-guides"

# System identity
system_hostname: "sp-dev"

# Define home directories based on usernames, with fallback for host_user
host_user_home: "/home/{{ host_user  }}"
automated_user_home: "/home/{{ automated_user }}"

# Define configs

facts_bash_config_installed: false
facts_zsh_config_installed: false
