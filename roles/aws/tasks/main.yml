---
- name: Ensure AWS CLI is available
  become: true
  become_user: "{{ host_user }}"
  ansible.builtin.command:
    cmd: aws --version
  register: aws_cli_version
  changed_when: false
  tags:
    - aws
    - verification

- name: Ensure AWS configuration directory exists
  ansible.builtin.file:
    path: "{{ host_user_home }}/.aws"
    state: directory
    owner: "{{ host_user }}"
    group: "{{ host_user }}"
    mode: "0700"
  tags:
    - aws
    - configuration

- name: Configure AWS IAM Identity Center profiles
  ansible.builtin.template:
    src: config.j2
    dest: "{{ host_user_home }}/.aws/config"
    owner: "{{ host_user }}"
    group: "{{ host_user }}"
    mode: "0600"
  tags:
    - aws
    - configuration
